<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="Description" content="This is an Awesome Website"/>
        <title>Arshia's Website</title>
    </head>

    <body style="background-color: #2cac2c;">

        <h1>Arshia's Website</h1>

        <!-- Break Tags Can Make A blank new line -->
        <br/>

        <!-- This is a Horizontal Rule That and it makes
        a new space between two tages and it makes a
        black line between them -->
        <hr/>

        <!-- Italic Tags And Bold Tags -->
        <!-- You Can use Them in Each Other Example:
        Third-Paragraph -->
        <p>This is the first <b>paragraph</b></p>
        <p>This is the second <i>paragraph</i></p>
        <p>This is the third <b><i>paragraph</i></b></p>

        <!-- Big tags can make a text look bigger
        And at the other side the Small tags can make
        your text look smaller -->
        <p> <big>This is</big> the <small>fourth</small> paragraph</p>

        <!-- The  Subscrpit tag job is to lower the text 
        And the Supscript tag job is to higher the text-->
        <p><big>H<sub>2</sub>O</big>   |||     <big>10<sup>2</sup></big></p>
    
        <!-- It is alwaays better two write css in another 
        file seperate from html but because this course
        is about html we will write the style tag in the tags -->
        
        <!-- color attribute in style will change the color
        of the text -->
        <p style="color: blue;"><b>This is the Fifth paragraph</b></p>
        <hr/>

        <!-- background-color attribute in style will change
        the background color of the element -->
        <p style="background-color: blue;"><b>This is the Fifth paragraph</b></p>
    
        <!-- Theres a website that contains all of the css colors
         = https://www.w3schools.com/cssref/css_colors.asp -->

         
    </body>
</html>
